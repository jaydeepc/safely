<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shlok</title>
  <link rel="stylesheet" href="../pages/ui.css">
  <style>
    body { width: 350px; padding: 16px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .card { padding: 14px; }
    .hint { margin: 10px 0 0; font-size: 12.5px; text-align: center; }
    .site { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .site b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .login { display: flex; align-items: center; gap: 10px; padding: 8px; margin: 0 -6px; border-radius: 13px; transition: background 0.15s; animation: rise 0.4s var(--spring) both; }
    .login:hover { background: var(--soft); }
    .avatar { flex: none; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 700; background: var(--grad); }
    .login .who { flex: 1; min-width: 0; }
    .login .who b, .login .who span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .login .who span { font-size: 12px; color: var(--muted); }
    .mini { border: 0; border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: transform 0.15s var(--spring); }
    .mini:active { transform: scale(0.92); }
    .mini.fill { color: #fff; background: var(--grad); }
    .mini.copy { color: #6b5a7d; background: #f8ecee; }
    .login:nth-child(3n+2) .avatar { background: var(--grad-grape); }
    .login:nth-child(3n) .avatar { background: var(--grad-sky); }
    .empty { text-align: center; padding: 8px 6px 4px; }
    .loader { width: 22px; height: 22px; margin: 10px auto; border-radius: 50%; border: 3px solid #ffe0d2; border-top-color: var(--primary); animation: spin 0.8s linear infinite; }
    .add-toggle { display: block; width: 100%; margin-top: 8px; padding: 9px; border: 1.5px dashed #ffb39c; border-radius: 12px; background: transparent; color: var(--primary-deep); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.15s var(--spring); }
    .add-toggle:hover { background: var(--soft); transform: translateY(-1px); }
    .add-form { display: grid; gap: 8px; margin-top: 10px; animation: rise 0.35s var(--spring); }
    .add-form input { width: 100%; padding: 9px 11px; border: 1.5px solid var(--line); border-radius: 11px; font: inherit; font-size: 13px; outline: none; transition: border-color 0.15s; }
    .add-form input:focus { border-color: var(--primary); }
    .add-form .pw { display: flex; gap: 6px; }
    .add-form .pw input { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    .add-form .dice { flex: none; width: 38px; border: 0; border-radius: 11px; background: var(--grad-grape); color: #fff; font-size: 16px; cursor: pointer; transition: transform 0.3s var(--spring); }
    .add-form .dice:active { transform: rotate(180deg) scale(0.9); }
    .add-note { font-size: 12px; text-align: center; min-height: 16px; }
    footer { display: flex; gap: 8px; }
    footer .btn { flex: 1; padding: 9px 10px; font-size: 12.5px; border-radius: 11px; }
  </style>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>

  <header>
    <div class="brand"><img src="../icons/icon128.png" alt="">Shlok</div>
    <span id="pill" class="pill">Checking…</span>
  </header>

  <div class="stack">
    <section class="card">
      <div class="chain">
        <div class="node on" id="n-browser">
          <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="12" rx="2.5"/><path d="M8.5 20h7M12 16.5V20"/></svg></div>
          Browser
        </div>
        <div class="wire" id="w-key"></div>
        <div class="node" id="n-key">
          <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M17.5 12v3.2M20.5 12v2.2"/></svg></div>
          Key
        </div>
        <div class="wire" id="w-phone"></div>
        <div class="node" id="n-phone">
          <div class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 18.5h3"/></svg></div>
          Phone
        </div>
      </div>
      <p class="hint muted" id="hint"></p>
    </section>

    <section class="card" id="site-card" hidden>
      <div class="site"><b id="site-host"></b><span class="small muted" id="site-count"></span></div>
      <div id="logins"></div>
      <button class="add-toggle" id="add-toggle">+ Add a login for this site</button>
      <form class="add-form" id="add-form" hidden autocomplete="off">
        <input id="add-user" placeholder="Username or e-mail" autocomplete="off" spellcheck="false">
        <div class="pw">
          <input id="add-pass" placeholder="Password" autocomplete="off" spellcheck="false">
          <button type="button" class="dice" id="add-dice" title="Generate a strong password">✦</button>
        </div>
        <button class="btn primary block" id="add-save">Save to my phone</button>
        <div class="add-note muted" id="add-note"></div>
      </form>
    </section>

    <section class="card" id="settings-card" hidden>
      <label class="switch"><span><b>Fill automatically</b><br><span class="small muted">When exactly one login matches</span></span><input type="checkbox" id="s-autofill"></label>
      <label class="switch"><span><b>Offer to save new logins</b><br><span class="small muted">Stored on your phone, never in Chrome</span></span><input type="checkbox" id="s-save"></label>
    </section>

    <footer>
      <button class="btn primary" id="pair" hidden>Pair with phone</button>
      <button class="btn ghost" id="import" hidden>Import passwords</button>
      <button class="btn ghost" id="setup" hidden>Finish setup</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
